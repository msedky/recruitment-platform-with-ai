services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: recruitment-postgres
    environment:
      POSTGRES_DB: recruitment_platform_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama (default AI provider) ───────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: recruitment-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama   # persists the pulled model between restarts
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot job: pulls the model the app expects, then exits.
  # First run takes several minutes (~4.7GB download) — subsequent
  # runs are instant since ollama-data already has the model cached.
  ollama-init:
    image: curlimages/curl:8.10.1
    container_name: recruitment-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "curl -s http://ollama:11434/api/pull -d '{\"name\": \"llama3.1:8b\"}'"
    restart: "no"

  # ── Spring Boot application ────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruitment-app
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-ollama}
      DB_URL: jdbc:postgresql://postgres:5432/recruitment_platform_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.1:8b
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CV_STORAGE_PATH: /app/uploads/cvs
    ports:
      - "8080:8080"
    volumes:
      - cv-uploads:/app/uploads/cvs
    depends_on:
      postgres:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  ollama-data:
  cv-uploads: