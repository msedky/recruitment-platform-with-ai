services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: recruitment-postgres
    environment:
      POSTGRES_DB: recruitment_platform_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recruitment-net

  # ── RabbitMQ ───────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: recruitment-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management UI → http://localhost:15672
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recruitment-net

  # ── Elasticsearch ──────────────────────────────────────────────────────────
  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: recruitment-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false   # disabled for local dev — no auth needed
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - recruitment-net

  # ── Ollama (AI model — dev only) ───────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: recruitment-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama   # persists downloaded models between restarts
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - recruitment-net

  # ── Spring Boot Application ────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruitment-app
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/recruitment_platform_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: mistral
      CV_STORAGE_PATH: /app/uploads/cvs
    ports:
      - "8080:8080"
    volumes:
      - cv-uploads:/app/uploads/cvs   # persists uploaded CV files
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - recruitment-net

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  rabbitmq-data:
  elasticsearch-data:
  ollama-data:
  cv-uploads:

# ── Network ────────────────────────────────────────────────────────────────
networks:
  recruitment-net:
    driver: bridge