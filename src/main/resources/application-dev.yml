spring:
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create-drop}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # ── AI — Ollama (local) ───────────────────────────────────────────────────
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:mistral}

# ── Local file storage path ───────────────────────────────────────────────
app:
  cv:
    storage:
      path: uploads/cvs