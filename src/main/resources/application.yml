server:
  port: ${PORT:8080}

spring:
  application:
    name: recruitment-platform

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:ollama}

  # ── Datasource ────────────────────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/recruitment_platform_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  # ── JPA ───────────────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create-drop}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # ── File upload limits ────────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB


# ── Actuator ──────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

# ── Application-level config ───────────────────────────────────────────────
app:
  cv:
    storage:
      path: ${CV_STORAGE_PATH:uploads/cvs}