
<style>
#erd { padding: 1rem 0; }
#erd svg { width: 100%; height: auto; }
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#3C3489' : '#EEEDFE',
    primaryBorderColor: dark ? '#7F77DD' : '#AFA9EC',
    primaryTextColor: dark ? '#CECBF6' : '#3C3489',
    secondaryColor: dark ? '#085041' : '#E1F5EE',
    secondaryBorderColor: dark ? '#1D9E75' : '#5DCAA5',
    tertiaryColor: dark ? '#633806' : '#FAEEDA',
    tertiaryBorderColor: dark ? '#EF9F27' : '#BA7517',
  },
});
const diagram = `erDiagram
  applicants {
    uuid id PK
    varchar full_name
    varchar email UK
    varchar phone
    varchar nationality
    varchar address
    varchar linkedin_url
    varchar portfolio_url
    text summary
    varchar status
    timestamp created_at
    timestamp updated_at
  }

  cv_files {
    uuid id PK
    uuid applicant_id FK
    varchar original_file_name
    varchar stored_file_name
    varchar file_path
    bigint file_size
    varchar file_type
    timestamp created_at
    timestamp updated_at
  }

  work_experiences {
    uuid id PK
    uuid applicant_id FK
    varchar company_name
    varchar job_title
    varchar role_type
    date start_date
    date end_date
    boolean is_current
    text description
    timestamp created_at
    timestamp updated_at
  }

  educations {
    uuid id PK
    uuid applicant_id FK
    varchar institution
    varchar degree_type
    varchar field_of_study
    date start_date
    date end_date
    boolean is_current
    varchar grade
    timestamp created_at
    timestamp updated_at
  }

  skills {
    uuid id PK
    uuid applicant_id FK
    varchar name
    varchar level
    timestamp created_at
    timestamp updated_at
  }

  certificates {
    uuid id PK
    uuid applicant_id FK
    varchar name
    varchar issuing_organization
    date issue_date
    date expiry_date
    timestamp created_at
    timestamp updated_at
  }

  languages {
    uuid id PK
    uuid applicant_id FK
    varchar name
    varchar proficiency
    timestamp created_at
    timestamp updated_at
  }

  outbox_events {
    uuid id PK
    uuid aggregate_id
    varchar event_type
    text payload
    varchar status
    int retry_count
    timestamp last_attempt_at
    timestamp created_at
    timestamp updated_at
  }

  applicants ||--|| cv_files : "has one"
  applicants ||--o{ work_experiences : "has many"
  applicants ||--o{ educations : "has many"
  applicants ||--o{ skills : "has many"
  applicants ||--o{ certificates : "has many"
  applicants ||--o{ languages : "has many"
`;
const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
