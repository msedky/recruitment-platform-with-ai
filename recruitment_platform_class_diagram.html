
<style>
#cd { padding: 1rem 0; }
#cd svg { width: 100%; height: auto; }
</style>
<div id="cd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#3C3489' : '#EEEDFE',
    primaryBorderColor: dark ? '#7F77DD' : '#AFA9EC',
    primaryTextColor: dark ? '#CECBF6' : '#3C3489',
    secondaryColor: dark ? '#085041' : '#E1F5EE',
    secondaryBorderColor: dark ? '#1D9E75' : '#5DCAA5',
    tertiaryColor: dark ? '#0C447C' : '#E6F1FB',
    tertiaryBorderColor: dark ? '#378ADD' : '#85B7EB',
  },
});
const diagram = `classDiagram

  class CvUploadController {
    +uploadCv(MultipartFile) ResponseEntity
  }

  class CvUploadService {
    -storageService StorageService
    -applicantRepository ApplicantRepository
    -cvFileRepository CvFileRepository
    -outboxRepository OutboxRepository
    +handleUpload(MultipartFile) String
  }

  class StorageService {
    <<interface>>
    +store(MultipartFile, String) String
    +load(String) Resource
    +delete(String) void
  }

  class LocalStorageService {
    +store(MultipartFile, String) String
    +load(String) Resource
    +delete(String) void
  }

  class S3StorageService {
    +store(MultipartFile, String) String
    +load(String) Resource
    +delete(String) void
  }

  class OutboxScheduler {
    -outboxRepository OutboxRepository
    -rabbitTemplate RabbitTemplate
    +publishPendingEvents() void
  }

  class CvUploadedConsumer {
    -storageService StorageService
    -applicantRepository ApplicantRepository
    -skillRepository SkillRepository
    -workExperienceRepository WorkExperienceRepository
    -educationRepository EducationRepository
    -certificateRepository CertificateRepository
    -languageRepository LanguageRepository
    -aiExtractionService AiExtractionService
    -rabbitTemplate RabbitTemplate
    +consume(CvUploadedEvent) void
  }

  class AiExtractionService {
    <<interface>>
    +extract(String) ApplicantDTO
  }

  class OllamaExtractionService {
    +extract(String) ApplicantDTO
  }

  class BedrockExtractionService {
    +extract(String) ApplicantDTO
  }

  class CvExtractedConsumer {
    -applicantRepository ApplicantRepository
    -searchIndexer SearchIndexer
    +consume(CvExtractedEvent) void
  }

  class SearchIndexer {
    <<interface>>
    +index(ApplicantDocument) void
    +findById(String) Optional~ApplicantDocument~
    +search(String) List~ApplicantDocument~
  }

  class ElasticsearchIndexer {
    +index(ApplicantDocument) void
    +findById(String) Optional~ApplicantDocument~
    +search(String) List~ApplicantDocument~
  }

  class EsRetryScheduler {
    -applicantRepository ApplicantRepository
    -searchIndexer SearchIndexer
    +retryIndexPending() void
  }

  class ApplicantQueryService {
    -applicantRepository ApplicantRepository
    -searchIndexer SearchIndexer
    +findById(String) ApplicantDTO
    +search(String) List~ApplicantDTO~
  }

  class ApplicantQueryController {
    +findById(String) ResponseEntity
    +search(String) ResponseEntity
  }

  class CvUploadedDlqListener {
    -rabbitTemplate RabbitTemplate
    +handleDlq(CvUploadedEvent) void
  }

  class CvExtractedDlqListener {
    -rabbitTemplate RabbitTemplate
    +handleDlq(CvExtractedEvent) void
  }

  CvUploadController --> CvUploadService : uses
  CvUploadService --> StorageService : uses
  CvUploadService --> OutboxRepository : uses
  StorageService <|.. LocalStorageService : dev profile
  StorageService <|.. S3StorageService : prod profile

  OutboxScheduler --> OutboxRepository : reads PENDING
  OutboxScheduler --> RabbitTemplate : publishes

  CvUploadedConsumer --> StorageService : load file
  CvUploadedConsumer --> AiExtractionService : extract
  CvUploadedConsumer --> ApplicantRepository : persist extracted data
  CvUploadedConsumer --> RabbitTemplate : publishes applicantId only
  AiExtractionService <|.. OllamaExtractionService : dev profile
  AiExtractionService <|.. BedrockExtractionService : prod profile

  CvExtractedConsumer --> ApplicantRepository : load by applicantId
  CvExtractedConsumer --> SearchIndexer : index to ES
  SearchIndexer <|.. ElasticsearchIndexer : implements

  EsRetryScheduler --> SearchIndexer : retry index
  EsRetryScheduler --> ApplicantRepository : reads INDEX_PENDING

  ApplicantQueryController --> ApplicantQueryService : uses
  ApplicantQueryService --> SearchIndexer : query ES first
  ApplicantQueryService --> ApplicantRepository : fallback

  CvUploadedDlqListener --> RabbitTemplate : re-queues
  CvExtractedDlqListener --> RabbitTemplate : re-queues
`;
const { svg } = await mermaid.render('cd-svg', diagram);
document.getElementById('cd').innerHTML = svg;

document.querySelectorAll('#cd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
</script>
